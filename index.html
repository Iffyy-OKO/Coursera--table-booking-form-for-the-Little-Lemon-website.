<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Little Lemon</title>

    styles.css
</head>
<body>

    

        <div>
            <label for="email">Email Address:</label>
            <input
                type="email"
                id="email"
                name="email"
                required>
        </div>

        <br>

        <div>
            <label for="booking-date">Date of Booking:</label>
            <input
                type="date"
                id="booking-date"
                name="booking-date"
                required>
        </div>

        <br>

        <div>
            <label for="people">Number of People:</label>
            <input
                type="number"
                id="people"
                name="people"
                min="1"
                max="8"
                required>
        </div>

        <br>

        <div>
            <label>
                <input
                    type="checkbox"
                    name="policy"
                    required>
                I agree to the cancellation policy
            </label>
        </div>

        <br>

        <div>
            <button type="submit">Book Now!</button>
        </div>

    </form>

</body>
</html>
